# fly.toml app configuration file generated for MedOPS

app = "medops"
primary_region = "bos"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "medops_data"
  destination = "/data"
  initial_size = "1GB"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/medops.db"
